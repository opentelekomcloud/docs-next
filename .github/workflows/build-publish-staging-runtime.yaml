name: Build and Deploy Staging Runtime Docker Images

on:    
    workflow_dispatch:   

jobs:
    build-preview:
      name: Build Staging Artifacts
      environment: 
        name: staging
      runs-on: ubuntu-24.04
      outputs:
        image_version: ${{ steps.build_image_tag.outputs.image_version }}
  
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Setup NodeJS
          uses: actions/setup-node@v4
          with:
            node-version: 'lts/*'

        - name: Install NodeJS Dependencies
          run: npm install

        - name: Get Commit Hash
          id: commit_hash
          uses: prompt/actions-commit-hash@v3

        - name: Get Current Date
          id: date
          run: echo "today=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

        - name: Build Image Tag
          id: build_image_tag
          run: echo "image_version=${{ steps.date.outputs.today }}.${{github.run_number}}.0-${{ steps.commit_hash.outputs.short }}-runtime" >> $GITHUB_OUTPUT

        - name: Build Container Image Metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: |
              ${{ vars.REGISTRY }}/${{ vars.REGISTRY_ORG }}/${{ vars.IMG_NAME }}
            tags: |
              type=raw,value=${{ steps.build_image_tag.outputs.image_version }}
    
        - name: Login to Container Registry
          uses: docker/login-action@v3
          with:
            registry: ${{ vars.REGISTRY }}
            username: ${{ secrets.REGISTRY_USER }}
            password: ${{ secrets.REGISTRY_PASSWORD }}
          
        - name: Setup Docker Buildx
          id: buildx
          uses: docker/setup-buildx-action@v3.7.1

        - name: Build and Push (Docker Image)
          id: docker_build 
          uses: docker/build-push-action@v6.9.0
          with: 
            context: ./
            file: ./Dockerfile.dynamic
            provenance: false
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            annotations: ${{ steps.meta.outputs.annotations }}

    